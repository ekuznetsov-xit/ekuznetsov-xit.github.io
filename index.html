<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Awesome App</title>

  <!-- iOS Smart Banner will be set dynamically -->

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover {
      opacity: 0.9;
    }

    .secondary {
      border: 1px solid #e2e8f0;
      color: var(--text);
    }

    .secondary:hover {
      background: #f1f5f9;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">X</div>
    <h1 id="appName"></h1>
    <p>
      A simple and powerful app to test how App Link & Universal Link work.<br />
      Available for Android and iOS.
    </p>

    <a id="downloadButton" href="#" class="button primary">
      Download App
    </a>

    <a id="iosButton" href="#" class="button secondary">
      Download for iOS
    </a>

    <a id="androidButton" href="#" class="button secondary">
      Download for Android
    </a>

    <div class="footer">
      © 2026 Xinfotech. All rights reserved.
    </div>
  </div>

  <script>
    /* =========================
       SINGLE SOURCE OF TRUTH
       ========================= */

    const APP_NAME = "XIT Links";              
    const APP_STORE_ID = "YOUR_APP_STORE_ID";       
    const ANDROID_PACKAGE = "com.xinfotech.onboardingdemo";   

    /* ========================= */

    const iosLink = `https://apps.apple.com/app/id${APP_STORE_ID}`;
    const androidLink = `https://play.google.com/store/apps/details?id=${ANDROID_PACKAGE}`;

    // Set dynamic title + header
    document.title = APP_NAME;
    document.getElementById("appName").textContent = APP_NAME;

    // Set Smart App Banner dynamically
    const meta = document.createElement("meta");
    meta.name = "apple-itunes-app";
    meta.content = `app-id=${APP_STORE_ID}`;
    document.head.appendChild(meta);

    // Set button links
    const downloadButton = document.getElementById("downloadButton");
    const iosButton = document.getElementById("iosButton");
    const androidButton = document.getElementById("androidButton");

    iosButton.href = iosLink;
    androidButton.href = androidLink;

    // Device detection
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      downloadButton.href = androidLink;
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      downloadButton.href = iosLink;
    } else {
      downloadButton.href = androidLink;
    }
  </script>

</body>
</html>
