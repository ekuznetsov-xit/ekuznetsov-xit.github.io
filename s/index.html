<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open App</title>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --card: #ffffff;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .card {
      background: var(--card);
      max-width: 520px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
      text-align: center;
      border: 1px solid rgba(226,232,240,.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 { font-size: 22px; margin-bottom: 10px; }
    p { font-size: 15px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .idbox {
      margin: 14px 0 22px;
      padding: 12px 14px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fbfdff;
      font-size: 14px;
      color: var(--text);
      word-break: break-all;
      text-align: left;
    }

    .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: .2s ease;
      text-align: center;
    }

    .primary { background: var(--primary); color: white; }
    .primary:hover { opacity: .92; }

    .secondary { border: 1px solid var(--border); color: var(--text); background: white; }
    .secondary:hover { background: #f1f5f9; }

    .small { margin-top: 14px; font-size: 12px; color: var(--muted); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Fallback page</div>
    <h1 id="title">Open App</h1>
    <p>Install the app to continue.</p>

    <div class="idbox">
      <div class="label">Link ID</div>
      <div><code id="linkId">—</code></div>
    </div>

    <a id="primaryBtn" class="button primary" href="#">Install App</a>
    <a id="iosBtn" class="button secondary" href="#">Download for iOS</a>
    <a id="androidBtn" class="button secondary" href="#">Download for Android</a>

    <div class="small">
      Android uses Play Install Referrer. iOS opens App Store page.
    </div>
  </div>

  <script>
    /* =========================
       SINGLE SOURCE OF TRUTH
       ========================= */
    const APP_NAME = "XIT Links";              
    const APP_STORE_ID = "YOUR_APP_STORE_ID";       
    const ANDROID_PACKAGE = "com.xinfotech.onboardingdemo";   
    const BASE = ""; 
    /* ========================= */

    document.title = `Open ${APP_NAME}`;
    document.getElementById("title").textContent = `Open ${APP_NAME}`;

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "";
    document.getElementById("linkId").textContent = id || "missing";

    // --- URLs ---
    const iosUrl = `https://apps.apple.com/app/id${APP_STORE_ID}`;

    const referrerParams = new URLSearchParams({
      utm_source: "github_pages",
      utm_medium: "applink",
      link_id: id
    }).toString();

    const androidUrl =
      `https://play.google.com/store/apps/details?id=${encodeURIComponent(ANDROID_PACKAGE)}` +
      `&referrer=${encodeURIComponent(referrerParams)}`;

    const primaryBtn = document.getElementById("primaryBtn");
    const iosBtn = document.getElementById("iosBtn");
    const androidBtn = document.getElementById("androidBtn");

    iosBtn.href = iosUrl;
    androidBtn.href = androidUrl;

    // --- Device detection ---
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    if (isAndroid) {
      primaryBtn.href = androidUrl;
      primaryBtn.textContent = "Install on Google Play";
    } else if (isIOS) {
      primaryBtn.href = iosUrl;
      primaryBtn.textContent = "Download on the App Store";
    } else {
      primaryBtn.href = androidUrl;
      primaryBtn.textContent = "Install App";
    }
  </script>
</body>
</html>
